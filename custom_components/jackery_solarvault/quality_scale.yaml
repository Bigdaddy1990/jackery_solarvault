# Internal Home Assistant Integration Quality Scale evidence matrix.
# Authoritative rule list:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/checklist
#
# manifest.json intentionally reports quality_scale: custom. These statuses are
# conservative engineering evidence, not an official Core-integration badge.

rules:
  # Bronze
  action-setup:
    status: done
  appropriate-polling:
    status: done
    comment: HTTP polling defaults to 30 seconds and is configurable from 15 to 600 seconds.
  brands:
    status: done
    comment: HACS-compatible light, dark, and high-resolution icons ship in brand/.
  common-modules:
    status: done
  config-flow-test-coverage:
    status: done
    comment: The complete Config, Options, Reauth, Reconfigure, and discovery flow group reaches 100 percent line and branch coverage.
  config-flow:
    status: done
  dependency-transparency:
    status: done
    comment: Direct runtime dependencies are declared; Home Assistant supplies cryptography.
  docs-actions:
    status: done
    comment: README.md links the complete services.yaml action contract.
  docs-triggers:
    status: exempt
    comment: The integration provides no custom trigger platform. #TODO
  docs-conditions:
    status: exempt
    comment: The integration provides no custom condition platform. #TODO
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  entity-event-setup:
    status: done
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
    comment: The typed coordinator is stored on ConfigEntry.runtime_data.
  test-before-configure:
    status: done
  test-before-setup:
    status: done
  unique-config-entry:
    status: done

  # Silver
  action-exceptions:
    status: done
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: Each transport logs an outage once, recovery once, and repeats at debug.
  parallel-updates:
    status: done
    comment: Read-only platforms use 0; command platforms use 1.
  reauthentication-flow:
    status: done
  test-coverage:
    status: todo
    comment: Current coverage.xml still has integration modules below 95 percent. #TODO

  # Gold
  devices:
    status: done
  diagnostics:
    status: done
    comment: Diagnostics apply mandatory recursive redaction with no runtime bypass.
  discovery-update-info:
    status: exempt
    comment: Discovery opens an account flow; no per-device host is stored in the entry. #TODO
  discovery:
    status: done
  docs-data-update:
    status: done
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: done
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
  entity-translations:
    status: done
  exception-translations:
    status: done
  icon-translations:
    status: done
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
  stale-devices:
    status: done

  # Platinum
  async-dependency:
    status: done
    comment: Network I/O is async; synchronous QR rendering uses the HA executor.
  inject-websession:
    status: done
    comment: Every JackeryApi receives async_get_clientsession(hass).
  strict-typing:
    status: done
    comment: The current-worktree strict mypy gate passes for every integration source module.
