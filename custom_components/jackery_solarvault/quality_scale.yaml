  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: >-
      Coordinator-based integration: _async_update_data raises UpdateFailed on a
      cold cycle (see tests test_hung_cycle_raises_update_failed and
      test_auth_failure_starts_reauth_but_keeps_polling), so the
      DataUpdateCoordinator base class emits the once-only unavailable and
      recovered log messages.
  parallel-updates:
    status: done
  reauthentication-flow:
    status: done
  test-coverage:
    status: todo

  devices:
    status: done
  diagnostics:
    status: done
  discovery-update-info:
    status: exempt
    comment: >-
      Cloud-account integration. Bluetooth/DHCP/Zeroconf/MQTT discovery only prompt
      the single cloud-account setup (see async_step_dhcp/zeroconf/bluetooth/mqtt);
      device identity is the Jackery account, not a per-device network address, so
      there is no stored host/IP to update on rediscovery.
  discovery:
    status: done
