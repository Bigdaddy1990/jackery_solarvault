name: Auto-merge Dependabot

on:
  # This privileged workflow never checks out or executes a PR head.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_run:
    workflows:
      - CI
      - Validate
      - Pre-commit Lite
      - pre-commit-autofix
      - Python Modernization
      - Pyrefly Type Check
      - Dependency Review
      - Merge Safety Regression
    types: [completed]
  workflow_dispatch:

concurrency:
  # Serialize decisions, including dispatch sweeps and different completed checks.
  group: dependabot-merge-safety
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  automerge:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify current head and merge only after all mandatory checks
        uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/merge-safety/gate.cjs');
            await run({ github, context, core });
