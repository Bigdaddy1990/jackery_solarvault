name: Pre-commit Lite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # for actions/checkout, if you're in a private repo
  pull-requests: write
  actions: write
  checks: write
  id-token: write # for Trusted Publishing + attest-action
  issues: write
  
concurrency:
  group: pre-commit-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  pre-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            pyproject.toml

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install test dependencies for type-checking hooks
        run: uv pip install --system -r requirements.txt -r requirements-test.txt

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: pre-commit-ci-lite automatic fixes
        uses: pre-commit-ci/lite-action@v1.1.0
        if: always()
