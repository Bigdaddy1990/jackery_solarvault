name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily run catches HACS/hassfest spec changes that affect this repo
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements-sync:
    name: Requirements source check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install requirement parser
        run: python -m pip install packaging
      - name: Verify supported Home Assistant minimum resolves
        run: |
          python -m pip install --dry-run --ignore-installed \
            -r requirements.txt -r requirements-test.txt \
            "homeassistant==2026.9.4"
      - name: Verify requirement sources
        run: python -m scripts.sync_requirements --check

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: Ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check custom_components/ tests/
      - name: Format check
        run: ruff format --check custom_components/ tests/

  unit-tests:
    name: Unit / source-only tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install unit-test deps
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Compile integration and tests
        run: python -m compileall -q custom_components tests
      - name: Type check integration
        run: python -m mypy custom_components/jackery_solarvault
      - name: Run unit tests
        run: pytest -q -p no:cacheprovider tests/
