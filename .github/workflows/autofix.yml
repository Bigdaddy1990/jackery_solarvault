name: pre-commit-autofix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # for actions/checkout, if you're in a private repo
  pull-requests: write
  actions: write
  checks: write
  id-token: write # for Trusted Publishing + attest-action
  issues: write

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION != '' && vars.PYTHON_VERSION || '3.14' }}
      HA_SPEC: ${{ vars.HA_VERSION != '' && format('=={0}', vars.HA_VERSION) || '' }}

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            pyproject.toml

      - name: Install deps
        run: |
          # Resolve helper tools together with HA's pinned transitive dependencies.
          python -m pip install --upgrade \
            -r requirements.txt -r requirements-test.txt \
            pyupgrade flake8-type-checking reorder-python-imports
          python -m pip check

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
          #enable-cache: true
          #ignore-nothing-to-cache: true

      - name: Run pre-commit with fixes
        run: |
          # A fixing pass may return 1 after modifying files. The next pass
          # must pass every hook using these same cached hook environments.
          pre-commit run --all-files || true

      - uses: pre-commit/action@v3.0.1
      # Keep system hooks in the interpreter containing HA and its native types.
      - run: python -m pre_commit run --all-files
      - uses: pre-commit-ci/lite-action@v1.2.0
        with:
          msg: apply code formatting
