name: pre-commit-autofix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # for actions/checkout, if you're in a private repo
  pull-requests: write
  actions: write
  checks: write
  id-token: write # for Trusted Publishing + attest-action

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION != '' && vars.PYTHON_VERSION || '3.14' }}
      HA_SPEC: ${{ vars.HA_VERSION != '' && format('=={0}', vars.HA_VERSION) || '' }}
      
jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            pyproject.toml

      - name: Install deps
        run: |
          pip install -r requirements.txt --upgrade
          pip install -r requirements-test.txt --upgrade
          pip install --upgrade uv-pre-commit ruff pyupgrade flake8-type-checking reorder-python-imports

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
          #enable-cache: true
          #ignore-nothing-to-cache: true

      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff check --fix
      - run: ruff format
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()
        with:
          msg: apply code formatting

      - name: Run pre-commit with fixes
        run: |
          ruff check . --fix || true
          ruff check . --fix --unsafe-fixes || true
          ruff check . --target-version py314 || true
          ruff check . --extend-select RUF100 || true
          ruff check . --preview || true
          ruff check . --output-format=github || true
          ruff check . --exit-non-zero-on-fix || true
          ruff format . || true
          pre-commit run --all-files || true
          pre-commit run --hook-stage manual python-typing-update --check --py314-plus --ruff || true

      - uses: pre-commit/action@v3.0.1
      - run: uvx pre-commit run --all-files
