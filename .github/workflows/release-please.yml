name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: write # for actions/checkout, if you're in a private repo
  pull-requests: write
  actions: write
  checks: write
  id-token: write # for Trusted Publishing + attest-action

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install the verified Home Assistant test stack
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip check
          python -m scripts.sync_ha_test_baseline --check
      - name: Compile and import every shipped integration module
        run: python -m scripts.check_integration_imports
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # oder RELEASE_PLEASE_TOKEN (PAT)
          release-type: simple
