name: Dependency Review

on:
  pull_request:
    branches-ignore:
      - "autofix/**"

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # for actions/checkout, if you're in a private repo
  pull-requests: write
  actions: write
  checks: write
  id-token: write # for Trusted Publishing + attest-action

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION != '' && vars.PYTHON_VERSION || '3.14' }}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
