name: Pyrefly Type Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allows manual triggering from the GitHub UI

permissions:
  contents: write # for actions/checkout, if you're in a private repo
  pull-requests: write
  actions: write
  checks: write
  id-token: write # for Trusted Publishing + attest-action

concurrency:
  group: pyrefly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          # Value already defaults to true, but `persist-credentials` is required to push new commits to the repository.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            pyproject.toml

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
          #enable-cache: true
          #ignore-nothing-to-cache: true
      - run: uv add ruff pyrely
      # Install Python dependencies and create environment
      - name: Install dependencies
        run: |
          python -m pip install --upgrade
          # Install your dependencies; adjust the following lines as needed
          pip install -r requirements-test.txt

      #- name: Install Pyrefly
        #run: pip install pyrefly

      - name: Run Pyrefly Type Checker
        run: pyrefly check --output-format=github --python-version=3.14
