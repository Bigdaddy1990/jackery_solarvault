version: 2
updates:
  # Python packages declared in requirements*.txt and pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
      include: "scope"
    # HA 2026.9.4 uses pytest plugin 0.13.367, which pins coverage==7.15.4.
    # Revisit with an explicitly reviewed HA minimum / pytest-stack upgrade.
    ignore:
      - dependency-name: "coverage"
        versions: [">7.15.4"]
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      production:
        applies-to: "version-updates"
        patterns:
          - "aiohttp"
          - "aiomqtt"
          - "bleak-retry-connector"
          - "cryptography"
          - "segno"
          - "voluptuous"
      home-assistant:
        applies-to: "version-updates"
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
          - "pytest-homeassistant"
          - "homeassistant-stubs"
      testing:
        applies-to: "version-updates"
        patterns:
          - "coverage"
          - "hypothesis"
          - "pytest*"
      tooling:
        applies-to: "version-updates"
        patterns:
          - "annotatedyaml"
          - "jinja2"
          - "mypy"
          - "packaging"
          - "pip"
          - "pre-commit"
          - "pyrefly"
          - "pylint"
          - "pyyaml"
          - "ruff"
          - "types-*"
          - "typing-extensions"

  # The repository root includes workflows and any local or nested actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"

  # Hooks declared in .pre-commit-config.yaml.
  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
      tooling:
        applies-to: "version-updates"
        patterns:
          - "*"
